name: Build Aqorbox APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o aqorbox-android-admob.zip -d ./unzipped && ls -R ./unzipped | head -n 100
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: |
          cd unzipped
          if [ -f "package.json" ]; then npm install; npx cap sync android || true; fi
          if [ -f "android/gradlew" ]; then cd android && chmod +x gradlew && ./gradlew assembleDebug; else echo "gradlew not found"; find . -name gradlew; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Aqorbox-APK
          path: "**/*.apk"
          if-no-files-found: warn
