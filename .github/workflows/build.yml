name: Build AQORBOX APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www && echo '<!doctype html><meta charset="utf-8"><title>AQORBOX</title>' > www/index.html
      - run: npx cap add android
      - run: pip install pillow
      - run: python3 patch.py
      - run: npx cap sync android

      # TAMBAHAN BIAR GAK UNSIGNED - BIKIN KUNCI OTOMATIS
      - name: Bikin Keystore Otomatis
        run: |
          keytool -genkey -v -keystore android/app/aqorbox.keystore -alias aqorbox -keyalg RSA -keysize 2048 -validity 10000 -storepass aqorbox123 -keypass aqorbox123 -dname "CN=AQORBOX, OU=Game, O=AQORBOX, L=Jakarta, ST=ID, C=ID"

      # TAMBAHAN BUILD RELEASE SIGNED
      - name: Build Release Signed
        run: |
          cd android
          echo "
          android {
            signingConfigs {
              release {
                storeFile file('aqorbox.keystore')
                storePassword 'aqorbox123'
                keyAlias 'aqorbox'
                keyPassword 'aqorbox123'
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }" >> app/build.gradle
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: aqorbox-release-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/aqorbox.keystore
